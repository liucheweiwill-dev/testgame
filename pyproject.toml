[project]
name = "blackjack"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["flask>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "mutmut>=3.0",
    "vulture>=2.11",
    "import-linter>=2.0",
    "diff-cover>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain", "src/web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: a property-based test. The Property-based gauntlet layer runs only these, and pytest exits 5 when none are collected, so the layer fails if they all disappear.",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
src = ["src"]

[tool.mutmut]
paths_to_mutate = ["src/domain"]

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 60

[tool.importlinter]
root_packages = ["domain", "web"]
# Required because the contract below forbids external packages (flask, jinja2),
# not just internal ones.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain does not depend on web"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["web", "flask", "jinja2"]

[[tool.importlinter.contracts]]
name = "no cycles"
type = "independence"
modules = ["domain"]
